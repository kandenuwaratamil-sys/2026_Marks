  "GRADE9": "Grade 09", "GRADE10A": "Grade 10A", "GRADE- 10B": "Grade 10B",
  " GRADE11": "Grade 11", "NW 10B": "NW 10B"
};

function parseMark(v) {
  if (v === undefined || v === null || v === '' || String(v).toLowerCase() === 'ab') return NaN;
  return parseFloat(v);
}

function getSubjects(student) {
  const exclude = new Set(['no','indexNo','name','grade','TOTAL','AVERAGE','RANK','COUNT']);
  return Object.keys(student).filter(k => !exclude.has(k) && student[k] !== undefined && student[k] !== '');
}

function flattenData(data) {
  const result = [];
  const seen = new Set();
  for (const grade in data) {
    data[grade].forEach(s => {
      const key = s.indexNo + '-' + s.name;
      if (!seen.has(key)) { seen.add(key); result.push(s); }
    });
  }
  return result;
}

const allStudents = flattenData(DATA);
const grades = [...new Set(allStudents.map(s => s.grade))].sort();

function getGradeLabel(g) { return GRADE_LABELS[g] || g; }

(function init() {
  const gf = document.getElementById('gradeFilter');
  grades.forEach(g => {
    const o = document.createElement('option');
    o.value = g;
    o.textContent = getGradeLabel(g);
    gf.appendChild(o);
  });
  filterData();
})();

function filterData() {
  const grade = document.getElementById('gradeFilter').value;
  const query = document.getElementById('searchBox').value.trim().toLowerCase();
  let filtered = allStudents;
  if (grade !== 'ALL') filtered = filtered.filter(s => s.grade === grade);
  if (query) {
    filtered = filtered.filter(s =>
      s.name.toLowerCase().includes(query) ||
      s.indexNo.toLowerCase().includes(query) ||
      getGradeLabel(s.grade).toLowerCase().includes(query)
    );
  }
  document.getElementById('resultCount').textContent = filtered.length + ' student(s)';
  renderTable(filtered);
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTable(students) {
  const container = document.getElementById('tableContainer');
  if (students.length === 0) {
    container.innerHTML = '<div class="no-result">No students found for this grade</div>';
    return;
  }

  const allSubs = new Set();
  students.forEach(s => getSubjects(s).forEach(sub => allSubs.add(sub)));
  const subs = [...allSubs].sort();

  let html = '<table><thead><tr><th>#</th><th>Index No</th><th>Name</th><th>Grade</th>';
  subs.forEach(sub => { html += '<th>' + escHtml(sub) + '</th>'; });
  html += '<th>Total</th><th>Avg</th><th>Rank</th></tr></thead><tbody>';

  students.forEach((s, idx) => {
    html += '<tr>';
    html += '<td>' + (idx + 1) + '</td>';
    html += '<td>' + escHtml(s.indexNo) + '</td>';
    html += '<td class="name-cell">' + escHtml(s.name) + '</td>';
    html += '<td><span class="grade-badge">' + getGradeLabel(s.grade) + '</span></td>';

    let total = 0, count = 0;
    subs.forEach(sub => {
      const v = s[sub];
      const m = parseMark(v);
      if (v !== undefined && v !== '') {
        if (String(v).toLowerCase() === 'ab') {
          html += '<td><span class="ab">ab</span></td>';
        } else if (!isNaN(m)) {
          total += m; count++;
          const cls = m >= 40 ? 'pass' : 'fail';
          html += '<td class="' + cls + '">' + m + '</td>';
        } else {
          html += '<td>-</td>';
        }
      } else {
        html += '<td>-</td>';
      }
    });

    const avg = count > 0 ? (total / count).toFixed(1) : '-';
    html += '<td><strong>' + total + '</strong></td>';
    html += '<td>' + avg + '</td>';
    const r = parseInt(s.RANK);
    if (r === 1) html += '<td><span class="rank-badge rank-gold">1</span></td>';
    else if (r === 2) html += '<td><span class="rank-badge rank-silver">2</span></td>';
    else if (r === 3) html += '<td><span class="rank-badge rank-bronze">3</span></td>';
    else html += '<td>' + (s.RANK || '-') + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}
</script>
